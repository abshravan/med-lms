[project]
name = "med-lms-api"
version = "0.1.0"
description = "MedLMS domain API — medical education platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
    # S3-compatible client. Cloudflare R2 speaks the S3 API, so one client
    # covers R2 in production and MinIO/moto in development and tests.
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.22.0",
    # Runs a real in-process S3 server, so presigned URLs are exercised with
    # actual PUT/GET traffic rather than asserted on as strings.
    "moto[s3,server]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# boto3 publishes no py.typed marker. `boto3-stubs` is tens of megabytes of
# generated code for the single S3 client used here, so the untyped import is
# accepted and `S3StorageProvider` annotates its own public surface instead.
module = ["fakeredis.*", "alembic.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
