[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, ordered filenames so migration history reads chronologically in a
# directory listing and merge conflicts on revision ordering are obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally absent — the URL comes from DATABASE_URL via
# alembic/env.py so there is exactly one source of truth and no credentials in
# version control.

[post_write_hooks]
# `exec` rather than `console_scripts`: the latter resolves ruff through
# importlib entrypoints, which fails when ruff is installed as a standalone
# binary (its usual distribution form). `exec` just runs it from PATH.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
